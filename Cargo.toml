[package]
name = "herdr-quicknotes"
version = "0.1.0"
edition = "2024"
authors = ["QuantumEdu"]
description = "Fast, popup notes manager for Herdr with fuzzy search, CLI & clipboard support"
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
arboard = "3.4"
uuid = { version = "1.10", features = ["v4", "serde"] }
dirs = "5.0"
fuzzy-matcher = "0.3"
